services:
  # ---------------------------------------------------------------------------
  # Broker MQTT - Eclipse Mosquitto
  # ---------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over WebSocket
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - iot_network

  # ---------------------------------------------------------------------------
  # Publisher - simula sensores e publica no broker
  # ---------------------------------------------------------------------------
  publisher:
    build:
      context: .
      dockerfile: publisher/Dockerfile
    container_name: iot_publisher
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    networks:
      - iot_network

  # ---------------------------------------------------------------------------
  # Subscriber - recebe do broker e grava no SQLite
  # ---------------------------------------------------------------------------
  subscriber:
    build:
      context: .
      dockerfile: subscriber/Dockerfile
    container_name: iot_subscriber
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - DB_PATH=/data/tanque.db
    volumes:
      - ./database:/data
    networks:
      - iot_network

  # ---------------------------------------------------------------------------
  # Dashboard - lê o SQLite e serve a interface Dash em http://localhost:8050
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: iot_dashboard
    restart: unless-stopped
    depends_on:
      - subscriber
    environment:
      - DB_PATH=/data/tanque.db
    volumes:
      - ./database:/data:ro
    ports:
      - "8050:8050"
    networks:
      - iot_network

networks:
  iot_network:
    driver: bridge
    name: iot_network
